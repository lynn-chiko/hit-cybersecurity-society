    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

        <h2>HIT CyberSec Society</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="learn.html">Learn</a>
            <a href="events.html">Events</a>
            <a href="gallery.html">Gallery</a>

    <section class="page-content">

        <h1>Password Strength Checker 🔐</h1>

        <p>
            Enter a password below to check how strong it is.
        </p>


        <div class="card">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

          <div class="password-requirements">
    <p>Password must have:</p>
    <p id="length">8 or more characters</p>
    <p id="lowercase">At least 1 lowercase letter</p>
    <p id="uppercase">At least 1 uppercase letter</p>
    <p id="number">At least 1 number</p>
</div>

            <h3 id="result"></h3>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>
